name: CI

on:
  push:
  pull_request:

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dashboard
      - run: uv run --extra dashboard pytest
      - run: uv run --extra dashboard ruff check .
      - run: uv run --extra dashboard mypy src
      - run: uv run --extra dashboard python scripts/run_smoke.py
      - run: uv run --extra dashboard python scripts/demo_dashboard.py
