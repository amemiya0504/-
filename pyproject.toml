[project]
name = "gtts"
version = "0.1.0"
description = "台指期量化研究系統的離線研究骨架"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6,<7", "tzdata>=2024.1"]

[project.optional-dependencies]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "streamlit>=1.40,<2", "httpx>=0.27,<1"]
fubon = ["fubon-neo>=2.5,<2.6"]

[dependency-groups]
dev = ["coverage>=7.6,<8", "pytest>=8,<9", "ruff>=0.8,<1", "mypy>=1.13,<2", "types-PyYAML>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
