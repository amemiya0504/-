services:
  api:
    build: .
    environment:
      GTTS_RUNS_DIR: /data
    volumes:
      - ./runs:/data:ro
    ports:
      - "127.0.0.1:8000:8000"
  dashboard:
    build: .
    command: streamlit run src/gtts/dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment:
      GTTS_API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:8501:8501"
